# Copy to config.yaml and edit. config.yaml is read in preference to this file.

league: Allflame          # 3.29 challenge league. Verified against
                          # https://www.pathofexile.com/api/trade/data/leagues
realm: pc

database:
  path: data/originator.db

model:
  directory: models
  # Backend preference order. The first one that imports and trains wins.
  # Falls back to sklearn_hgb, which is always available.
  backends: [catboost, catboost_mae, lightgbm, lightgbm_mae, xgboost, sklearn_hgb]
  target: log1p          # "log1p" or "raw" -- see docs/architecture.md

display:
  # Unit prices are shown in. Everything is stored and modelled in chaos; this
  # only changes what you read. "auto" uses chaos below ~2000c and divine above.
  currency: chaos          # chaos | divine | auto

currency:
  # Divine -> chaos conversion. NOT a permanent constant: override it in the
  # Settings page or with `python -m src.cli set-rate <value>`.
  divine_to_chaos: 210.0
  # What an Exalted Orb costs, in chaos. This is the whole right-hand side of
  # the exalt-worthy decision, so it is refreshed from poe.ninja rather than
  # trusted as a constant. Only a starting value.
  #
  # Note how small it is: since 3.19 the Exalted Orb is an ordinary crafting
  # currency, and poe.ninja put it at 1.25 chaos in Allflame against 47k volume
  # an hour. A stale value of 10 or 25 here does not merely shift the verdict,
  # it inverts it -- almost every exalt looks worth taking at 1.25c and almost
  # none does at 25c.
  exalted_to_chaos: 1.25

market:
  # Listings older than this are excluded from training by default.
  max_age_days: 7
  # Absolute sanity bounds in chaos. Anything outside is flagged as an outlier.
  # Observed 3.29 uncorrupted T16 spread on 820 collected listings: median ~40c,
  # 90th ~300c, 95th ~460c, 99th ~920c, 99.5th ~1150c, max 69000c. The bulk of
  # the market is 30c to 3 divine, so the ceiling sits just above that at 1000c:
  # the 0.7% of listings above it are parked inventory and price-fixing asks,
  # and left in they dominate every chart and drag the model's high end upward.
  # The floor at 5c cuts unpriced-in-all-but-name junk without touching the
  # genuinely cheap maps that make up the bottom quartile (~10c).
  plausible_price_chaos: [5, 1000]
  # The range you actually expect to trade in -- 30c to 3 divine at the current
  # rate. Used only to focus charts, never to exclude data or clamp a prediction.
  typical_price_chaos: [30, 660]
  # Recency weights applied during training, as (max_age_hours, weight) pairs.
  # These are a starting point only; tune them with `python -m src.cli train --tune-weights`.
  recency_weights:
    - [12, 1.0]
    - [24, 0.9]
    - [72, 0.7]
    - [168, 0.4]
    - [999999, 0.2]

market_comparison:
  # The second pricing mode: instead of asking the trained model, ask the trade
  # site which maps like this one are listed *right now* and derive a price from
  # those. Slower and API-heavy, and fully explainable -- every price carries the
  # listings it came from.
  #
  # Tolerance steps, tried in order until enough comparables come back. The
  # numbers are multipliers on a per-feature window (see TOLERANCE_BASE in
  # src/market/live_comparables.py): 1.0 means +/-10 quantity, +/-20 rarity,
  # +/-5 pack size and so on, so one multiplier means the same kind of closeness
  # on features that do not share a scale.
  #
  # It starts tight and widens because a tight window really is usually empty:
  # a live probe on 2026-08-25 of a 1.0 window around a real map matched exactly
  # one listing in the whole league. Which step succeeded is recorded and shown,
  # because an answer found at 4.0 is a weaker answer than one found at 1.0.
  tolerance_schedule: [1.0, 2.0, 4.0]
  # Stop widening once this many comparables have come back.
  min_comparables: 6
  # Most listings read for one map. Each fetch reads 10 ids, so 30 costs three
  # fetch requests on top of the search.
  max_comparables: 30
  # Hard ceiling on requests for one run, searches and fetches together. This is
  # not a rate -- the rate limiter already obeys GGG's published policy -- it is
  # how many requests you are willing to spend at all. GGG's search policy allows
  # thirty searches per five minutes sustained, so 200 requests is roughly a
  # 10-15 minute run. Hitting the ceiling stops the run cleanly; already-priced
  # maps stay priced and re-running continues where it left off.
  request_budget: 200
  # Read the market ONCE for the whole tab instead of once per map.
  #
  # This is the difference between a few minutes and an hour and a half on a
  # full tab. Seventy maps quantise to about sixty-five distinct buckets, so the
  # bucket cache below saves almost nothing, and each bucket costs a search plus
  # up to three fetches. A shared read costs sixteen searches whatever the tab
  # holds -- the same stratified slices the training collector walks -- and every
  # map's comparables are then picked out of it locally, by the same distance
  # and the same tolerance schedule a per-map search would have used.
  #
  # A map the pool has nothing like still gets a search of its own, so an
  # unusual map is priced from real comparables rather than from whatever
  # happened to be nearby. And the run costs both plans against GGG's published
  # policy and takes the cheaper: on a three-map tab the per-map path wins, and
  # pooling switches itself off.
  pool: true
  # Listing ids read from each slice. Every ten cost one fetch request, and the
  # fetch policy allows fifty per five minutes, so this knob decides most of a
  # pooled run's wall-clock. Fifty across sixteen slices is about eight hundred
  # live listings for eighty fetches.
  pool_per_slice: 50
  # How long a bucket's search results stay usable. Live prices go stale, and an
  # hour-old answer presented as the current market is worse than no answer.
  # Within the TTL, near-identical maps in the same tab cost zero extra requests.
  cache_ttl_minutes: 30
  # Listings older than this are not evidence about the price now, and are
  # dropped before the price is derived.
  max_listing_age_hours: 48
  # "online" | "any". The model is fitted to the whole listing book because that
  # is the largest honest sample; this mode answers "what is a map like this
  # selling for right now", and an offline seller's ask is not an offer you can
  # take.
  status: online
  # Where the bucket cache is kept between runs. Safe to delete at any time.
  cache_path: data/market_comparison_cache.json

pricing:
  # Multipliers applied to fair value. Re-estimated from observed spread once
  # enough market data exists; see src/pricing/sell_strategy.py.
  strategies:
    quick_sell: 0.94
    market: 0.99
    patient: 1.06

scope:
  # Which maps the model will price. Everything else is surfaced as "Unsupported".
  # Set by the user at build time; see docs/originator-modifiers.md for why this
  # matters -- the high-value Originator market is largely corrupted maps.
  map_tier: 16
  require_uncorrupted: true

overlay:
  # The desktop overlay draws the stash grid on top of the real stash tab. It
  # cannot find the tab by itself -- that would mean screen-reading the game --
  # so you line it up once with `python -m src.cli overlay --calibrate` and this
  # block is what that writes back.
  #
  # Screen pixels of the top-left corner of cell (0,0). Negative values are
  # correct and expected on a monitor to the left of, or above, the primary one:
  # these are virtual-desktop coordinates, not per-monitor ones.
  origin: [0, 0]
  # Cell pitch in pixels, deliberately a float. The stash panel scales with the
  # window, so 12 columns rarely land on a whole number, and rounding to 53
  # instead of 53.4 walks five pixels out of line by the right-hand column --
  # far enough to put a price on the neighbouring map.
  cell_px: 53.4
  # Columns x rows. 12x12 is a normal tab; a quad tab is 24x24. The grid also
  # grows on its own to fit whatever the priced tab actually contains.
  grid: [12, 12]
  # Window transparency. Below ~0.35 the numbers stop being readable over a lit
  # map device; at 1.0 you cannot see the maps underneath at all.
  opacity: 0.55
  # Which monitor you calibrated on. Informational -- `origin` already carries
  # the offset -- but it makes a mismatched calibration explainable.
  monitor: 0
  # System-wide show/hide chord, registered with Windows via RegisterHotKey.
  # If another application already owns it the overlay says so and carries on;
  # the control strip's buttons keep working regardless.
  hotkey_toggle: "ctrl+alt+o"
  # System-wide re-analyse chord: re-reads this tab from your account, re-prices
  # it in whatever mode the export was made in, and redraws in place -- so you
  # never have to alt-tab back to the browser between maps. Separate from the
  # toggle above because the two cost different things: showing a window is
  # free, and re-reading a tab spends a rate-limited API call.
  hotkey_analyze: "ctrl+alt+a"
  # `screen: [width, height]` is written by the calibration screen and is not
  # set here on purpose: its absence is what tells the overlay it has never been
  # calibrated. If it no longer matches your resolution, the overlay warns
  # rather than drawing a tidy grid of prices over the wrong maps.

overlay_inventory:
  # The second overlay: the same thing drawn over your character's inventory
  # instead of a stash tab. Every key means what it means above; it is a
  # separate block because the inventory panel is on the other side of the
  # screen and a different shape, so one calibration cannot serve both.
  #
  #   python -m src.cli overlay --profile inventory --calibrate
  #   python -m src.cli overlay --profile inventory
  #
  # Both overlays can run at once, as two processes.
  origin: [0, 0]
  cell_px: 53.4
  # The inventory is 12 across and 5 down and, unlike a stash tab, never
  # anything else -- there is no quad inventory.
  grid: [12, 5]
  opacity: 0.55
  monitor: 0
  # A different chord from the stash overlay on purpose: with both running, one
  # key toggling both would defeat the point of having two.
  hotkey_toggle: "ctrl+alt+i"
  # Likewise its own re-analyse chord, so analysing your inventory never also
  # spends a stash read you did not ask for.
  hotkey_analyze: "ctrl+alt+shift+a"

exalt:
  # Whether a map is worth an Exalted Orb. These used to be one line -- "is the
  # expectation bigger than the orb" -- which said yes to 92 of the 92 maps it
  # was ever shown. Under these it says yes to 28 of them.
  charge_every_open_slot: true  # two open slots is a two-orb decision
  effort_chaos: 5.0             # listing, waiting, whispering, meeting. Flat,
                                # because a trade costs the same few minutes
                                # whatever the map is worth.
  min_net_gain_fraction: 0.08   # net gain as a share of the map's own value
  min_chance_of_profit: 0.40    # a guard for thinner models; does not currently bind
  min_resolution_ratio: 1.0     # the net gain must clear the model's own 80%
                                # upside band. This is the gate that does the
                                # work: on the collected market 91 of 92
                                # predicted gains were smaller than the band,
                                # which means the model could not tell them
                                # from zero.
  require_training_floor: true  # no verdict at all under 30c, where the model
                                # is not fitted and returns much the same
                                # number for every map
  samples: 200                  # sampled fills when the open block is too
                                # large to enumerate exactly

collection:
  passive:
    # Unattended collection while the app is open. One scan is roughly 400 maps
    # for about 56 requests (one search per query slice, one fetch per ten
    # results), which GGG's published policy would allow far more often than
    # this -- the cooldown is politeness, not safety. RateLimiter obeys the
    # server's own headers regardless of what is set here.
    maps_per_scan: 400
    cooldown_minutes: 30
    auto_off_after_hours: 0   # 0 = run until the app closes
    auto_retrain: true
    retrain_every_scans: 4    # 4 scans is ~1600 listings; training is minutes

listing_tracker:
  enabled: false                 # stays off until POE_ACCOUNT_NAME is set
  poll_interval_minutes: 15
  young_listing_minutes: 60      # a listing this new is polled on the fast cadence
  young_poll_interval_minutes: 5
  reappearance_window_hours: 6   # a sold map returning this soon was never sold
  stale_after_hours: 24          # page filter: what counts as sitting
  fast_sale_hours: 1             # seeds the fast mark before you have quartiles
  target_window_hours: 24        # how fast you want a map to clear. Same number
                                 # as stale_after_hours by default, but a
                                 # different question -- one filters the page,
                                 # the other is the fit's target.
  target_sell_probability: 0.6
  calibration:
    enabled: true
    min_sold: 20
    clamp: [0.8, 1.3]
  ladder:
    steps: [[24, 0.92], [72, 0.85], [168, 0.78]]
    floor_ratio: 0.75
http:
  # GGG publishes rate limits in response headers; the client obeys whatever the
  # server reports. These are only the initial conservative guesses.
  user_agent_contact: "you@example.com"   # put a real address you monitor here
  min_request_interval_seconds: 2.0
